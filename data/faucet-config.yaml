# PoWFaucet config for Base (chain 84532). Based on PoWFaucet v2.6.0's faucet-config.example.yaml;
# see that file for every option: https://github.com/pk910/PoWFaucet/blob/v2.6.0/faucet-config.example.yaml
#
# NO SECRETS IN THIS FILE. The wallet key and faucet secret come from environment variables
# (FAUCET_ETH_WALLET_KEY, FAUCET_SECRET, and FAUCET_CAPTCHA_SECRET if captcha is on), set in .env on the server.
# Amounts are in wei (1 ETH = 1000000000000000000).
# Faucet wallet: the burner 0x4342bBb4FA142f2D5E7Fd02e7cFAc9FaF19B9BdE (its key goes in .env on the server).
# Sized for a small wallet (about 1 ETH): it stops before a full claim can no longer be paid.
version: 2

database:
  driver: "sqlite"
  file: "faucet-store.db"

faucetLogFile: "faucet-events.log"
faucetPidFile: "faucet-pid.txt"
serverPort: 8080
# Number of reverse proxies IN FRONT OF the container (the image's own nginx is accounted for already).
# Set to 1 if you put Caddy/nginx/Cloudflare in front, or every visitor shares one IP and the IP limits break.
httpProxyCount: 3   # Render: Cloudflare edge + 2 Render-internal hops (1 gave 10.x, 2 gave a Cloudflare IP)

faucetTitle: "Runes PoW Faucet"
faucetImage: "/images/fauceth_420.jpg"
faucetHomeHtml: |
  <div class='pow-info'>
    <h5>What is this?</h5>
    A faucet for <b>Runes</b>, an ERC-20 token on <b>Base</b> mainnet (chain 8453).<br>
    To stop bots draining it, you do a little proof-of-work mining in your browser in exchange for funds.
    Mining does not create Runes; it only slows down mass requests.
  </div>
  <div class='pow-info'>
    <h5>How does it work?</h5>
    Enter your Base address and start mining. When you've collected enough, stop and claim.
  </div>
  <div class='pow-info'>
    <h5>Help the faucet</h5>
    Send Runes (or a little Base ETH for gas) to:<br>{faucetWallet}
  </div>

# --- chain ---
ethRpcHost: "https://mainnet.base.org"   # public, rate-limited backup; on Render, render-start.sh adds Alchemy (ALCHEMY_RPC_URL) as primary
ethRpcMaxBlockHeightDiff: 10
ethRpcMonitorInterval: 10
ethRpcMonitorMeteredInterval: 60
ethTxBroadcastCount: 2
ethChainId: 8453   # Base mainnet
faucetCoinSymbol: "Runes"
faucetCoinType: "erc20"
faucetCoinContract: "0x68E63f682AB383A9132317349125fF7618C96e01"   # Runes, 18 decimals, on Base mainnet
# 100k rather than 21k so smart-contract wallets (common on Base) can receive; unused gas is not charged.
ethTxGasLimit: 100000
ethLegacyTx: false
ethTxMaxFee: 50000000              # 0.05 gwei max fee (Base mainnet is ~0.006 gwei); gas reserve per tx = 100k gas x this = 0.000005 ETH
ethTxPrioFee: 1000000            # 0.001 gwei tip
ethTxFeeCap: 1000000000000000      # never pay more than 0.001 ETH in fees for one claim
ethMaxPending: 12
ethQueueNoFunds: true
ethTxExplorerLink: "https://basescan.org/tx/{txid}"

# --- drops ---
maxDropAmount: 250000000000000000000000  # 250,000 Runes per claim at most
minDropAmount: 100000000000000000000000  # 100,000 Runes: a claim needs at least this much mined

sessionTimeout: 43200    # 12h
sessionCleanup: 2592000  # 30 days
sessionSaveTime: 120

modules:
  # Strongly recommended once you have keys: sign up at https://hcaptcha.com, put the site key here and
  # FAUCET_CAPTCHA_SECRET in .env, then set enabled: true. Off by default so the faucet starts without keys.
  captcha:
    enabled: true
    provider: "hcaptcha"
    siteKey: "f8bc57ba-446a-4c56-812e-e26c6c220a38"
    checkSessionStart: true
    checkBalanceClaim: false

  ensname:
    enabled: false

  # Cuts rewards for visitors on hosting providers / proxies (bot farms).
  ipinfo:
    enabled: true
    apiUrl: "http://ip-api.com/json/{ip}?fields=21155839"
    cacheTime: 86400
    required: false
    restrictions:
      hosting: 10
      proxy: 10

  # Refuse addresses that already hold plenty of Base ETH. Contracts allowed (smart wallets).
  ethinfo:
    enabled: true
    maxBalance: 1000000000000000000000000  # refuse addresses already holding 1,000,000+ Runes
    denyContract: false

  # Shrink rewards as the faucet wallet runs low. Value = % of normal reward kept; lowest applies.
  # Full rewards down to 0.5 ETH, half below that; noFundsBalance below stops it entirely.
  faucet-balance:
    enabled: true
    fixedRestriction:
      1000000000000000000000000: 50    # 50% rewards below 1,000,000 Runes left

  # Hard daily budget: at most ~1 ETH a day leaves the faucet, however many people mine.
  faucet-outflow:
    enabled: true
    amount: 500000000000000000000000   # 500,000 Runes
    duration: 86400                    # per day
    lowerLimit: -250000000000000000000000   # -250,000 Runes: rewards fall to 0%
    upperLimit: 250000000000000000000000    # 250,000 Runes buffer for spikes

  # Per IP and per address.
  recurring-limits:
    enabled: true
    limits:
      - limitCount: 1
        limitAmount: 250000000000000000000000  # 250,000 Runes (one full claim) per IP / address per day
        duration: 86400
      - limitCount: 3
        limitAmount: 500000000000000000000000  # 500,000 Runes per address per week
        duration: 604800
        byAddrOnly: true

  concurrency-limit:
    enabled: true
    concurrencyLimit: 1
    byAddrOnly: false
    byIPOnly: false

  pow:
    enabled: true
    powShareReward: 1000000000000000000000  # 1,000 Runes/share (~2048 argon2 hashes). ~200 H/s: min claim ~17 min, max ~43 min; at the 500 H/s cap: ~7 / ~17 min
    verifyMinerMissPenaltyPerc: 10
    verifyMinerRewardPerc: 15
    powSessionTimeout: 18000         # 5h
    powIdleTimeout: 1800             # 30min
    powHashrateSoftLimit: 500    # rule: 500 H/s max per session (client throttles to this)
    powHashrateHardLimit: 500    # rule: shares above 500 H/s are rejected server-side
    powDifficulty: 11
    powHashAlgo: "argon2"

# --- faucet wallet levels ---
spareFundsAmount: 0                     # token faucet: gas is paid in ETH, checked separately
noFundsBalance: 250000000000000000000000   # below 250,000 Runes: "out of funds" (a full claim must fit)
lowFundsBalance: 1000000000000000000000000  # below 1,000,000 Runes: low-funds warning
lowFundsWarning: "The faucet is running low! Faucet balance: {1}"
noFundsError: "Sorry, the faucet is out of funds :("
rpcConnectionError: "The faucet can't reach Base right now (RPC error)"

faucetStats:
  logfile: "faucet-stats.log"
buildSeoIndex: true
buildSeoMeta:
  keywords: "runes,faucet,base,erc20,pow"
